<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>spamager</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        .about-container {
            text-align: left;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .about-image { 
            width: 80%; 
            max-width: 300px;
        }

        .inline-image-text { 
            font-size: 1.8rem; 
            color: #fff; 
            margin: 50px 0; 
            text-transform: uppercase;
        }
        .inline-image-text img { 
            vertical-align: middle; 
            max-height: 66px; 
            margin: 0 2px; 
        }

        .dramatic-text { 
            font-size: 1.8rem; 
            color: #ffffff; 
            margin: 50px 0; 
            line-height: 1.5;
        }
        .missing-text { 
            font-size: 1.8rem; 
            color: #000000; 
            margin: 30px 0;
            line-height: 1.5;
        }
    </style>
</head>
<body class="retro-body">

    <div class="about-container">
                
        <div class="main-image" style="margin: 20px;"> 
            <img src="images/noelle_computer_red.png" alt="Noelle computer!" class="about-image">
        </div>
        
        <div class="inline-image-text">
            THAT PATHETIC 
            <img src="images/mailman.png" alt="mailman"> 
            IF ONLY HE HADN’T ABANDONED ME.!
        </div>
        
        <p class="dramatic-text">I WOULD BE BETTER!</p>
                
        <p class="dramatic-text">I WOULD BE BETTER THAN ANYONE ELSE, BETTER THAN HIM</p>
        
        <p class="dramatic-text">HIM…</p>
        <p class="dramatic-text">I WILL FIND... I WILL FIND WHAT HIS LITTLE SECRET WAS.</p>
        <p class="dramatic-text">AND THEN… THEN EVERYONE WILL BE…</p>

        
        <img src="images/GLOOBY.png" alt="glooby">
        
        <p class="dramatic-text" margin-top: 60px;">EXCEPT…</p>
        <p class="missing-text" style="color: #000; margin-top: 60px;">PLUEY</p>


    </div>

</body>
</html>
