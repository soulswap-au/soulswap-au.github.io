<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boooooo !</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        .scrolling-container {
            width: 100%;
            margin: 60px 0;
            background-color: #000;
        }

        .scrolling-row {
            height: 430px; /* Adjust this to match the height of the GIF */
            width: 100%;
            
            background-image: url('images/scair_dance.gif'); 
            background-repeat: repeat-x; 
            background-size: contain;
        }

        /* Top row moves Left */
        .row-left {
            animation: scrollLeft 3s linear infinite;
        }

        /* Bottom row moves Right */
        .row-right {
            animation: scrollRight 3s linear infinite;
        }

        /* --- Custom Scrolling Animations --- */
        @keyframes scrollLeft {
            from { background-position: 0px 0; }
            to { background-position: -270px 0; } 
        }

        @keyframes scrollRight {
            from { background-position: 0px 0; }
            to { background-position: 270px 0; } 
        }

    </style>
</head>
<body class="retro-body">

    <audio src="https://cdn.jsdelivr.net/gh/soulswap-au/soulswap-au.github.io@main/tenn-1m-views/audio/scary_scary.m4a" autoplay loop id="bg-music"></audio>

    <div class="scrolling-container">
        <div class="scrolling-row row-left"></div>
        <div class="scrolling-row row-right"></div>
        <div class="scrolling-row row-left"></div>
        <div class="scrolling-row row-right"></div>
        <div class="scrolling-row row-left"></div>
    </div>
<script data-goatcounter="https://hosward.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    
</body>
</html>
