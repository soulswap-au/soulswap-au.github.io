<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailroom</title>
    <style> 
        
    @font-face {
    font-family: '8bitOperatorPlus';
    src: url('fonts/8bitOperatorPlus-Bold.eot') format('embedded-opentype'), url('fonts/8bitOperatorPlus-Bold.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: block; /* Forcing the browser to wait for the font, should do WOFF2 instead */
}
        
        body {
            background-color: #000000;
            color: #000000;
            margin: 0;
            padding: 0;
            font-family: '8bitOperatorPlus';
            overflow-x: hidden;
        }
        .empty-space {
            height: 300vh; 
        }
        .secret-text {
            font-family: '8bitOperatorPlus';
            text-align: center;
            padding-bottom: 50px;
            font-size: 1.5rem;
        }
        ::selection {
            background-color: #00ff00;
            color: #000000;
        }
        ::-webkit-scrollbar {
            width: 24px;
        }
        
        ::-webkit-scrollbar-track {
            background: #111;
            border-left: 2px dashed #444;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff00ff;
            border: 2px solid #111; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00ffff;
        }
    </style>
</head>
<body>

    <audio src="audio/mailroom.m4a" autoplay loop id="bg-music"></audio>
    
    <main>
        <div class="empty-space"></div>
        <div class="secret-text">
            <h3>IT’S ALL FINE, WE DON’T NEED A MAIL GUY.</h3>
        </div>
    </main>
</body>
</html>
