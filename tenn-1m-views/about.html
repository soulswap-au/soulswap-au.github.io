<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ABOUT ME!</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        .about-container {
            text-align: center;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .chaotic-header { 
            font-size: 4.5rem; 
            color: #ff00ff; 
            text-shadow: 4px 4px 0px #00ffff, -2px -2px 0px #ff0000; 
            letter-spacing: 5px; 
            animation: jitter 0.15s infinite; 
        }

        .about-image { 
            width: 80%; 
            max-width: 450px;
        }

        .inline-image-text { 
            font-size: 1.8rem; 
            color: #0f0; 
            margin: 40px 0; 
            text-transform: uppercase;
        }
        .inline-image-text img { 
            vertical-align: middle; 
            max-height: 60px; 
            margin: 0 15px; 
        }

        .dramatic-text { 
            font-size: 1.8rem; 
            color: #0f0; 
            margin: 60px 0; 
            line-height: 1.5;
        }
        .missing-text { 
            font-size: 2.5rem; 
            color: #ff0000; 
            margin-bottom: 40px;
        }

        .stay-tuned-1 { font-size: 2rem; color: #00ffff; margin: 10px 0; }
        .stay-tuned-2 { font-size: 4rem; color: #ff00ff; text-shadow: 3px 3px #fff; margin: 10px 0; }
        .stay-tuned-3 { 
            font-size: 6rem; 
            color: #ff0000; 
            text-shadow: 5px 5px #ffaa00; 
            animation: zoomInOutTenna 0.5s infinite;
            margin: 10px 0; 
        }
        .please-text { 
            font-size: 0.9rem; 
            color: #555; 
            margin-top: 40px; 
        }
        .retro-back-btn {
            display: inline-block;
            background-color: #ff0000;
            color: #fff;
            padding: 15px 50px;
            font-size: 2rem;
            font-weight: bold;
            text-decoration: none;
            border: 6px ridge #ffff00;
            margin-top: 60px;
            margin-bottom: 40px;
            transition: transform 0.2s;
        }
        .retro-back-btn:hover {
            transform: scale(1.1);
            background-color: #ffff00;
            color: #ff0000;
            border-color: #ff0000;
        }
        @keyframes jitter {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            50% { transform: translate(-2px, -2px) rotate(-1deg); }
            100% { transform: translate(2px, -2px) rotate(1deg); }
        }
        @keyframes zoomInOutTenna {
            0% { transform: translate(-10px, -10px) rotate(-3deg) scale(1); }
            50% { transform: translate(-10px, -10px) rotate(-3deg) scale(1.15); } /* Zooms in by 15% */
            100% { transform: translate(-10px, -10px) rotate(-3deg) scale(1); }
        }
    </style>
</head>
<body class="retro-body">

    <div class="about-container">
        
        <h1 class="chaotic-header">ABOUT ME!</h1>
        
        <img src="images/tenn_spin.gif" alt="Me!" class="about-image">
        
        <div class="inline-image-text">
            RIGHT OVER, 
            <img src="images/ladies.png" alt="ladies"> 
            AND GERMS!
        </div>
        
        <p class="dramatic-text">GUESS WHO’S COMING TO YOUR HOUSE… THAT’S RIGHT!</p>
        
        <img src="images/tenn_text.png" alt="Tenn A. Vision" class="about-image">
        
        <p class="dramatic-text">THE SHOW IS ABOUT TO BEGIN. THE CAMERAS ARE READY. THE LIGHTS ARE READY.</p>
        
        <p class="missing-text">BUT SOMETHING IS MISSING…</p>
        
        <img src="images/you.gif" alt="you" class="about-image">
        
        <p class="dramatic-text" margin-top: 60px;">SO TELL ME, ARE YOU READY?</p>
        <p class="dramatic-text">NOW EVERYBODY...</p>
        
        <p class="stay-tuned-1">STAY TUNED!</p>
        <p class="stay-tuned-2">STAY TUNED!!</p>
        <p class="stay-tuned-3">STAY TUNED!!!</p>
        
        <p class="please-text">please.</p>

          <div>
            <a href="index.html" class="retro-back-btn">BACK</a>
         </div>

    </div>

</body>
</html>
