<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title> Broken TV</title>
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .isolated-modal {
            width: 90%;
            max-width: 600px;
            background-color: #000000;
            border: 2px solid #ffffff;
            padding: 25px;
            box-sizing: border-box;
        }

        .empty-frame {
            width: 100%;
            height: 300px;
            border: 1px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 2px;
        }
        .white-separator {
            border: 0;
            border-top: 1px dashed #ffffff;
            margin: 25px 0;
        }
        .comment-container {
            font-size: 1rem;
            line-height: 1.5;
        }
        .comment-user {
            font-weight: bold;
            color: #00dd00;
        }
        .comment-text {
            color: #00ff00;
            margin-top: 10px;
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>

    <div class="isolated-modal">
        
        <div class="empty-frame">
            [ MEDIA UNAVAILABLE ]
        </div>
        
        <hr class="white-separator">

        <div class="comment-container">
            <span class="comment-user">krizkroz:</span>
            <div class="comment-text">i remember watching this movie in class multiple times because it was the cheapest movie my cheap ass school would rent </3

movie sucks btw, im SO glad my schools shitty tv broke lol. they keep it in the library now</div>
        </div>

    </div>

</body>
</html>
