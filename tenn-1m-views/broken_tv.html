<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title> Broken TV</title>
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align:left;
        }

        .isolated-modal {
            width: 90%;
            max-width: 800px;
            background-color: #000000;
            border: 2px ridge #ffffff;
            box-shadown: 0 0 20px #ffffff
            padding: 25px;
            box-sizing: border-box;
        }

        .modal-top {
            display: flex;
            gap: 20px;
            min-height: 220px;
            margin: 20px;
        }
        .poster-placeholder {
            width: 150px;
            height: 220px;
            border: 2px solid #ffffff; 
            background-color: #000000;
            flex-shrink: 0; 
        }
        .comment-container {
            font-size: 1rem;
            line-height: 1.5;
        }
        .retro-comment {
            color: #00ff00;
            font-size: 1rem;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="isolated-modal">
        
        <div class="modal-top">
            <div class="poster-placeholder"></div>
        </div>
        
        <div class="modal-comments" style="border-top-color: #ffffff">
            <h3>&gt;&gt;&gt; AUDIENCE REVIEWS</h3>
        <p><strong>krizkroz:</strong> i remember watching this movie in class multiple times because it was the cheapest movie my cheap ass school would rent &lt;/3<br><movie sucks btw, im SO glad my schools shitty tv broke lol. they keep it in the library now</p>
        </div>
    </div>

</body>
</html>
