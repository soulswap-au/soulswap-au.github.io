<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title> Broken TV</title>
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .isolated-modal {
            width: 90%;
            max-width: 600px;
            background-color: #000000;
            border: 2px solid #ffffff;
            padding: 25px;
            box-sizing: border-box;
        }

        .modal-top {
            display: flex;
            gap: 20px;
            min-height: 220px; 
        }

        .poster-placeholder {
            width: 150px;
            height: 220px;
            border: 2px solid #ffffff; 
            background-color: #000000;
            flex-shrink: 0; 
        }
        
        .white-separator {
            border: 0;
            border-top: 1px dashed #ffffff;
            margin: 25px 0;
        }
        .comment-container {
            font-size: 1rem;
            line-height: 1.5;
        }

        .retro-comment {
            color: #00ff00;
            font-size: 1rem;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="isolated-modal">
        
        <div class="modal-top">
            <div class="poster-placeholder"></div>
        </div>
        
        <hr class="white-separator">

        <p class="retro-comment"><strong>krizkroz:</strong> i remember watching this movie in class multiple times because it was the cheapest movie my cheap ass school would rent &lt;/3<br><br>movie sucks btw, im SO glad my schools shitty tv broke lol. they keep it in the library now</p>

    </div>

</body>
</html>
